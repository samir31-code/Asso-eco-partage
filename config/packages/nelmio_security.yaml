nelmio_security:
    csp:
        enabled: false
        enforce:
            default-src: ["'self'"]
            script-src:
                - "'self'"
                - "'unsafe-inline'"
                - "'unsafe-eval'"
                - "https://cdn.jsdelivr.com"
            style-src:
                - "'self'"
                - "'unsafe-inline'"
                - "https://fonts.googleapis.com"
                - "https://cdn.jsdelivr.com"
                - "https://cdnjs.cloudflare.com"
            font-src:
                - "'self'"
                - "https://fonts.gstatic.com"
                - "https://cdnjs.cloudflare.com"
                - "data:"
            img-src:
                - "'self'"
                - "data:"
                - "blob:"
                - "https:"
            connect-src:
                - "'self'"
                - "http://localhost*"
                - "ws://localhost*"
            object-src: ["'none'"]
